packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 memblokir skrip install secara default: daftar yang diizinkan dan yang sengaja diabaikan.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@scarf/scarf'
  - unrs-resolver
