# Produksi di satu VPS: PostgreSQL + API + Web (Caddy, HTTPS otomatis) + backup harian.
#   cp deploy/.env.example deploy/.env   # lalu isi
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env up -d --build
# Panduan lengkap: docs/DEPLOY.md
name: bekuin

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bekuin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di deploy/.env}
      POSTGRES_DB: bekuin_pos
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bekuin -d bekuin_pos']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bekuin:${POSTGRES_PASSWORD}@db:5432/bekuin_pos?schema=public
      CORS_ORIGIN: https://${DOMAIN:?isi DOMAIN di deploy/.env}
      PUBLIC_WEB_URL: https://${DOMAIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?isi JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?isi JWT_REFRESH_SECRET}
      TRUST_PROXY: '1'
      UPLOAD_DIR: /data/uploads
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@bekuin.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-}
      SEED_DEMO_STOCK: 'false'
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_PUBLIC_WEB_URL: https://${DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?isi ACME_EMAIL di deploy/.env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  # Backup harian database + foto upload ke ./backups (lihat docs/DEPLOY.md bagian Backup).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ['sh', '/scripts/backup-loop.sh']
    environment:
      PGHOST: db
      PGUSER: bekuin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: bekuin_pos
      BACKUP_HOUR_WITA: ${BACKUP_HOUR_WITA:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/scripts/backup.sh:ro
      - ./deploy/backup-loop.sh:/scripts/backup-loop.sh:ro
      - ./backups:/backups
      - uploads:/data/uploads:ro

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
