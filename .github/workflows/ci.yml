name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bekuin
          POSTGRES_PASSWORD: bekuin
          POSTGRES_DB: bekuin_pos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bekuin -d bekuin_pos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bekuin:bekuin@localhost:5432/bekuin_pos?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-yang-panjangnya-minimal-32
      JWT_REFRESH_SECRET: ci-refresh-secret-yang-panjangnya-minimal-32
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bekuin/shared build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrasi + seed database
        run: |
          pnpm --filter @bekuin/api prisma:deploy
          pnpm --filter @bekuin/api prisma:seed
      - run: pnpm --filter @bekuin/api test:e2e
      - run: pnpm build

  # Pastikan image produksi (docker-compose.prod.yml) tetap bisa dibangun.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image API
        run: docker buildx build --load -f apps/api/Dockerfile -t bekuin-api .
      - name: Build image web
        run: docker buildx build --load -f apps/web/Dockerfile -t bekuin-web .
      - name: Validasi Caddyfile
        run: docker run --rm -e DOMAIN=contoh.id -e ACME_EMAIL=ci@contoh.id bekuin-web caddy validate --config /etc/caddy/Caddyfile
      - name: Validasi docker-compose.prod.yml
        run: cp deploy/.env.example deploy/.env && sed -i 's/=$/=isi/' deploy/.env && docker compose -f docker-compose.prod.yml --env-file deploy/.env config -q
